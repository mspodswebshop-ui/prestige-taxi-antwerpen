# Haalt de AI-foto's op en zet ze als bestanden in de website (zie .github/fotos.py).
name: AI-foto's ophalen

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: [".github/fotos.py", ".github/workflows/fotos.yml"]

permissions:
  contents: write

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fotos.py
      - name: Foto's opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A media *.html
          git diff --cached --quiet && exit 0
          git commit -m "AI-foto's als bestanden in de website"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
